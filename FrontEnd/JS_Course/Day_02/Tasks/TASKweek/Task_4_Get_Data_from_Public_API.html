<!DOCTYPE html>
<html lang="en">

<head>
    <title>Task 4 - Products</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <div class="container mt-3 mb-4">
        <h2>Products</h2>
        <div id="productsContainer" class="row g-3"></div>
    </div>

    <script>
        async function loadProducts() {
            const response = await fetch("https://fakestoreapi.com/products");
            const products = await response.json();
            const container = document.getElementById("productsContainer");

            products.forEach(product => {
                const productColumn = document.createElement("div");
                productColumn.className = "col-6 col-md-4 col-lg-3";

                productColumn.innerHTML = `
                    <div class="card h-100">
                        <div class="card-body d-flex justify-content-center align-items-center">
                            <img class="img-fluid w-50" src="${product.image}" alt="${product.title}">
                        </div>
                        <div class="card-footer bg-white">
                            <h6 class="card-title">${product.title}</h6>
                            <p class="card-text small mb-0">Price: $${product.price}</p>
                        </div>
                    </div>
                `;

                container.appendChild(productColumn);
            });
        }

        loadProducts();
    </script>
</body>

</html>
