<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>


<body class="alert container " style="background-color: rgb(251, 251, 249);">
    <h2 class="mt-4 p-3 text-dark p-3 bg-warning text-muted">Task 3: Greeting Based on Time..</h2>


    <label for="userName">Enter your name:</label>
    <input type="text" id="userName">
    <button onclick="greetByTime()" class="btn btn-dark btn-sm">Greet Me</button>
    <h2><div id="greeting" class="mt-3 p-4 bg-info text-muted"></div></h2>
<script>
    function greetByTime() 
    {
        const hour = new Date().getHours();
        const name = document.getElementById("userName").value.trim();
        let greeting = "";

        if (name === "") 
        {
        document.getElementById("greeting").innerText = "Please enter your name first.";
        return;
        }
        if (hour < 12) 
        {
        greeting = "Good Morning";
        } else if (hour < 18) {
            greeting = "Good Afternoon";
        } else {
            greeting = "Good Evening";
        }
      document.getElementById("greeting").innerText = `${greeting}, ${name}!`;
    }
  </script>
</body>
</html>
