<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- إعدادات الصفحة الأساسية وربط ملف التنسيق -->
    <meta charset="UTF-8">
    <meta name="description" content="إعدادات وتفضيلات المستخدم">
    <meta name="author" content="عبدالرحمن الدوسري">
    <title>إعدادات الحساب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- رأس صفحة الإعدادات وروابط التنقل -->
    <header>
        <h1>إعدادات الحساب</h1>
        <nav>
            <ul>
                <li><a href="../index/index.html">الرئيسية</a></li>
                <li><a href="../dashboard/index.html">لوحة التحكم</a></li>
                <li><a href="../profile/index.html">الملف الشخصي</a></li>
                <li><a href="../contact/index.html">تواصل معنا</a></li>
            </ul>
        </nav>
    </header>

    <!-- المحتوى الرئيسي الخاص بتفضيلات المستخدم -->
    <main>
        <!-- نموذج التحكم في اللغة والإشعارات والمظهر -->
        <section>
            <h2>تفضيلات المستخدم</h2>
            <form>
                <!-- القائمة المنسدلة لاختيار لغة الموقع -->
                <label for="language">اللغة المفضلة:</label>
                <select id="language" name="language">
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                </select>

                <!-- مربعات الاختيار تسمح بتحديد أكثر من نوع إشعار -->
                <fieldset>
                    <legend>الإشعارات:</legend>
                    <input type="checkbox" id="email-notifications" name="notifications" value="email" checked>
                    <label for="email-notifications">إشعارات البريد الإلكتروني</label><br>

                    <input type="checkbox" id="sms-notifications" name="notifications" value="sms">
                    <label for="sms-notifications">إشعارات الرسائل النصية</label>
                </fieldset>

                <!-- أزرار radio تسمح باختيار مظهر واحد فقط -->
                <fieldset>
                    <legend>مظهر الموقع:</legend>
                    <input type="radio" id="light-theme" name="theme" value="light" checked>
                    <label for="light-theme">فاتح</label>

                    <input type="radio" id="dark-theme" name="theme" value="dark">
                    <label for="dark-theme">داكن</label>
                </fieldset>

                <button type="submit">حفظ الإعدادات</button>
            </form>
        </section>
    </main>

    <!-- تذييل الإعدادات وروابط التواصل -->
    <footer>
        <a href="../index/index.html">العودة إلى الرئيسية</a>
        <p>© 2026 عبدالرحمن الدوسري - إعدادات الحساب</p>
        <div class="social-links">
            <a class="social-link" href="https://www.linkedin.com/in/abdulrhman1aldossry/" target="_blank"><span class="social-icon">in</span> لينكدإن</a>
            <a class="social-link" href="mailto:Abdulrhman@example.com"><span class="social-icon">✉</span> البريد الإلكتروني</a>
        </div>
    </footer>
</body>
</html>
